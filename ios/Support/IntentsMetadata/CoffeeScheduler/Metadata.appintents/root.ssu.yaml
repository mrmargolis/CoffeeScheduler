apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: net.mattmargolis.CoffeeScheduler
    intents:
    - metadata:
        name: CoffeeForDayIntent_0
        title: Coffee for the day
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }What''s my coffee ${CoffeeDay} in ${+applicationName}'
          - '{${+prefix} }What coffee is ${CoffeeDay} in ${+applicationName}'
          - '{${+prefix} }What''s my ${+applicationName} ${CoffeeDay}'
          - '{${+prefix} }Ask ${+applicationName} about my coffee ${CoffeeDay}'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - Coffee Scheduler
- name: CoffeeDay
  type: ssu/parameter
  definitions:
  - locale: en
    synomyms:
    - today
    - tomorrow
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml
