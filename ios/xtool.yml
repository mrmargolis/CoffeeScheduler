version: 1
bundleID: net.mattmargolis.CoffeeScheduler
product: CoffeeScheduler
infoPath: Support/Info.plist
iconPath: Support/AppIcon.png
entitlementsPath: Support/AppGroup.entitlements
# App Intents metadata for the Siri phrases, generated by Xcode in CI
resources:
  - Support/IntentsMetadata/CoffeeScheduler/Metadata.appintents
extensions:
  - product: CoffeeWidget
    infoPath: Support/CoffeeWidget-Info.plist
    entitlementsPath: Support/AppGroup.entitlements
    # App Intents metadata for the widget's buttons, generated by Xcode in CI
    resources:
      - Support/IntentsMetadata/CoffeeWidget/Metadata.appintents
