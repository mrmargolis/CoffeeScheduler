name: Pick an iPhone simulator
description: >-
  Find the newest plain iPhone simulator on the runner (not a Pro, Plus or
  Air) and give its identifier, for xcodebuild's -destination.
outputs:
  udid:
    description: The simulator's identifier.
    value: ${{ steps.pick.outputs.udid }}
runs:
  using: composite
  steps:
    - id: pick
      shell: bash
      run: |
        udid=$(xcrun simctl list devices available --json \
          | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone [0-9]+$"))] | last | .udid')
        test -n "$udid" && test "$udid" != null
        xcrun simctl list devices available | grep "$udid"
        echo "udid=$udid" >> "$GITHUB_OUTPUT"
