name: iOS

# Pushes to main and pull requests: a branch with a pull request open would
# otherwise run everything twice.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml", ".github/actions/**"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml", ".github/actions/**"]

permissions:
  contents: read

# A newer push to the same branch makes an in-progress run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Formatting (swift format, from the image's toolchain) and the style,
    # size and complexity caps in ios/.swiftlint.yml. lint.sh pins the
    # SwiftLint release and verifies its checksum.
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./lint.sh --reporter github-actions-logging

  core-tests:
    name: CoffeeCore tests (Linux)
    # The 24.04 image ships Swift 6.4, the toolchain xtool's Linux guide asks
    # for; the 26.04 image has no Swift at all.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ios/CoffeeCore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: swift --version
      - run: swift test --enable-code-coverage
      - name: Coverage summary
        # For reading on the run's page; no threshold fails the job.
        run: |
          jq -r '
            [.data[0].files[] | select(.filename | contains("/Sources/CoffeeCore/"))] as $files
            | ($files | map(.summary.lines.count) | add) as $count
            | ($files | map(.summary.lines.covered) | add) as $covered
            | "### CoffeeCore line coverage: \(($covered * 1000 / $count | round) / 10)%",
              "",
              "| File | Lines | Covered |",
              "| --- | ---: | ---: |",
              ($files[] | "| \(.filename | split("/") | last) | \(.summary.lines.count) | \((.summary.lines.percent * 10 | round) / 10)% |")
          ' "$(swift test --show-codecov-path)" >> "$GITHUB_STEP_SUMMARY"

  app-build:
    # Type-checks the SwiftUI app against the iOS SDK. Day-to-day builds use
    # xtool on Linux; this just catches breakage without needing a device.
    name: App build (iOS SDK)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - run: xcodebuild build -scheme CoffeeScheduler-Package -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

  screenshots:
    # Renders each screen over sample data on an iOS Simulator and uploads
    # the PNGs as the "screenshots" artifact.
    name: Screenshots (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pick-simulator
        id: sim
      - name: Run the app's tests and render screenshots
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
          TEST_RUNNER_SCREENSHOT_DIR: ${{ runner.temp }}
        run: |
          xcodebuild -list
          # With two products (app and widget) the tests are in the package's scheme
          xcodebuild test -scheme CoffeeScheduler-Package -destination "id=$SIM_UDID" CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
          retention-days: 30

  e2e:
    # UI tests: launch the app on an iOS Simulator over the sample data and
    # drive it with XCUITest. A Swift package can't host UI tests, so this
    # generates a small Xcode project (ios/E2E/project.yml) with XcodeGen.
    name: E2E tests (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate --spec E2E/project.yml
      - uses: ./.github/actions/pick-simulator
        id: sim
      - name: Boot the simulator
        # Otherwise the first test launches into a simulator that is still
        # starting up, where a launch can take over a minute and taps get lost.
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: xcrun simctl bootstatus "$SIM_UDID" -b
      - name: Run UI tests
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        # A test that fails is run again, up to three times in all: hosted
        # runners are slow enough that a wait sometimes times out.
        run: |
          xcodebuild test -project E2E/CoffeeE2E.xcodeproj -scheme CoffeeE2E \
            -destination "id=$SIM_UDID" -resultBundlePath "$RUNNER_TEMP/e2e.xcresult" \
            -retry-tests-on-failure -test-iterations 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: ${{ runner.temp }}/e2e.xcresult
          retention-days: 14

  intents-metadata:
    # The widget's buttons and the Siri phrases run App Intents, and iOS
    # finds those through a Metadata.appintents bundle that only Xcode's
    # build generates. This builds the app and the widget with Xcode and
    # uploads their bundles; the copies xtool ships are in
    # ios/Support/IntentsMetadata/<target>/Metadata.appintents, and the job
    # fails when those have fallen behind the intents in the code.
    name: Intents metadata
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/xcodegen
      - name: Build the app and the widget with Xcode
        run: |
          xcodegen generate --spec Support/IntentsMetadata/project.yml
          for target in CoffeeScheduler CoffeeWidget; do
            xcodebuild build -project Support/IntentsMetadata/CoffeeIntents.xcodeproj -target "$target" \
              -sdk iphoneos -configuration Release SYMROOT="$RUNNER_TEMP/intents" CODE_SIGNING_ALLOWED=NO
          done
      - name: Collect the metadata
        run: |
          for bundle in CoffeeScheduler.app CoffeeWidget.appex; do
            target=${bundle%.*}
            found=$(find "$RUNNER_TEMP/intents" -type d -name Metadata.appintents -path "*/$bundle/Metadata.appintents" | head -n 1)
            test -n "$found"
            mkdir -p "$RUNNER_TEMP/metadata/$target"
            cp -R "$found" "$RUNNER_TEMP/metadata/$target/"
          done
          find "$RUNNER_TEMP/metadata" -type f -exec ls -l {} \;
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intents-metadata
          path: ${{ runner.temp }}/metadata
          if-no-files-found: error
          retention-days: 30
      - name: Check the committed copies
        # After the upload, so a failure here leaves the bundles to copy in.
        # compare.py lets through what differs from one Xcode build to the next.
        run: |
          status=0
          for target in CoffeeScheduler CoffeeWidget; do
            committed="Support/IntentsMetadata/$target/Metadata.appintents"
            if ! python3 Support/IntentsMetadata/compare.py "$RUNNER_TEMP/metadata/$target/Metadata.appintents" "$committed"; then
              echo "::error::ios/$committed has fallen behind the intents in the code; replace it with this run's intents-metadata artifact."
              status=1
            fi
          done
          exit "$status"