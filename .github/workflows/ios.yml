name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

# A newer push to the same branch makes an in-progress run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: CoffeeCore tests (Linux)
    # Ubuntu 26.04 ships Swift 6.4, the toolchain xtool's Linux guide asks for.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ios/CoffeeCore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: swift --version
      - run: swift test

  app-build:
    # Type-checks the SwiftUI app against the iOS SDK. Day-to-day builds use
    # xtool on Linux; this just catches breakage without needing a device.
    name: App build (iOS SDK)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - run: xcodebuild build -scheme CoffeeScheduler -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
