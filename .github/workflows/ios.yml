name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

# A newer push to the same branch makes an in-progress run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: CoffeeCore tests (Linux)
    # The 24.04 image ships Swift 6.4, the toolchain xtool's Linux guide asks
    # for; the 26.04 image has no Swift at all.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ios/CoffeeCore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: swift --version
      - run: swift test

  app-build:
    # Type-checks the SwiftUI app against the iOS SDK. Day-to-day builds use
    # xtool on Linux; this just catches breakage without needing a device.
    name: App build (iOS SDK)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - run: xcodebuild build -scheme CoffeeScheduler -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

  screenshots:
    # Renders each screen over sample data on an iOS Simulator and uploads
    # the PNGs (light and dark) as the "screenshots" artifact.
    name: Screenshots (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone [0-9]+$"))] | last | .udid')
          test -n "$udid" && test "$udid" != null
          xcrun simctl list devices available | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Render screenshots
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
          TEST_RUNNER_SCREENSHOT_DIR: ${{ runner.temp }}
        run: |
          xcodebuild -list
          xcodebuild test -scheme CoffeeScheduler -destination "id=$SIM_UDID" CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
          retention-days: 30
