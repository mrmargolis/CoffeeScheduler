name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

# A newer push to the same branch makes an in-progress run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Formatting (swift format, from the image's toolchain) and the style,
    # size and complexity caps in ios/.swiftlint.yml. lint.sh pins the
    # SwiftLint release and verifies its checksum.
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./lint.sh --reporter github-actions-logging

  core-tests:
    name: CoffeeCore tests (Linux)
    # The 24.04 image ships Swift 6.4, the toolchain xtool's Linux guide asks
    # for; the 26.04 image has no Swift at all.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ios/CoffeeCore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: swift --version
      - run: swift test

  app-build:
    # Type-checks the SwiftUI app against the iOS SDK. Day-to-day builds use
    # xtool on Linux; this just catches breakage without needing a device.
    name: App build (iOS SDK)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - run: xcodebuild build -scheme CoffeeScheduler -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

  screenshots:
    # Renders each screen over sample data on an iOS Simulator and uploads
    # the PNGs as the "screenshots" artifact.
    name: Screenshots (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone [0-9]+$"))] | last | .udid')
          test -n "$udid" && test "$udid" != null
          xcrun simctl list devices available | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Render screenshots
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
          TEST_RUNNER_SCREENSHOT_DIR: ${{ runner.temp }}
        run: |
          xcodebuild -list
          xcodebuild test -scheme CoffeeScheduler -destination "id=$SIM_UDID" CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
          retention-days: 30

  e2e:
    # UI tests: launch the app on an iOS Simulator over the sample data and
    # drive it with XCUITest. A Swift package can't host UI tests, so this
    # generates a small Xcode project (ios/E2E/project.yml) with XcodeGen.
    name: E2E tests (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.42.0
          XCODEGEN_SHA256: a760b4bf97460341316a2c00d8c87b2946c6c2729eb57e9a72abb3ef7bc0ef82
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate the Xcode project
        run: xcodegen generate --spec E2E/project.yml
      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone [0-9]+$"))] | last | .udid')
          test -n "$udid" && test "$udid" != null
          xcrun simctl list devices available | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run UI tests
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcodebuild test -project E2E/CoffeeE2E.xcodeproj -scheme CoffeeE2E \
            -destination "id=$SIM_UDID" -resultBundlePath "$RUNNER_TEMP/e2e.xcresult"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-results
          path: ${{ runner.temp }}/e2e.xcresult
          retention-days: 14
